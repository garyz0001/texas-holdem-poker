name = "texas-holdem-poker"
main = "src/worker/index.ts"
compatibility_date = "2025-03-01"

# Static assets served directly by Cloudflare Workers (Free Tier supported)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws"]

# Durable Objects configuration using SQLite backend (100% Free on Cloudflare Workers Free Plan!)
[durable_objects]
bindings = [
  { name = "POKER_ROOM", class_name = "PokerRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerRoomDO"]
